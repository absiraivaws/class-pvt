services:
  db:
    image: postgres:16-alpine
    container_name: student-payment-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: student_payment
    ports:
      - "5433:5432"
    volumes:
      - student_payment_pgdata:/var/lib/postgresql/data

volumes:
  student_payment_pgdata:
